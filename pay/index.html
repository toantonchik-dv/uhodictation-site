<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>uho Dictation Checkout</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1020;
        --panel: rgba(255, 255, 255, 0.08);
        --stroke: rgba(255, 255, 255, 0.12);
        --text: rgba(255, 255, 255, 0.96);
        --muted: rgba(255, 255, 255, 0.68);
        --accent: #f3d24f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(66, 53, 255, 0.35), transparent 45%),
          linear-gradient(180deg, #121327 0%, #0b0c17 100%);
        color: var(--text);
        font-family: ui-rounded, "SF Pro Rounded", "SF Pro Display", system-ui, sans-serif;
      }

      .card {
        width: min(100%, 560px);
        padding: 28px;
        border-radius: 24px;
        background: var(--panel);
        border: 1px solid var(--stroke);
        backdrop-filter: blur(18px);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 30px;
        line-height: 1.05;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }

      .status {
        margin-top: 18px;
        padding: 14px 16px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>uho Dictation</h1>
      <p>
        Secure checkout is opening. If it does not appear automatically, this page is probably missing a
        valid Paddle client-side token or transaction ID.
      </p>
      <div class="status" id="status">Preparing checkout...</div>
    </main>

    <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
    <script>
      const PADDLE_CLIENT_TOKEN = "live_ff072890c35f34cf2ae20f08e15";
      const statusEl = document.getElementById("status");
      const transactionId = new URLSearchParams(window.location.search).get("_ptxn");

      function setStatus(text) {
        statusEl.textContent = text;
      }

      if (!transactionId) {
        setStatus("Missing _ptxn in the URL. Open this page through a Paddle checkout link.");
      } else if (PADDLE_CLIENT_TOKEN.includes("__")) {
        setStatus("Missing Paddle client-side token. Add a real token before using this page.");
      } else if (!window.Paddle) {
        setStatus("Paddle.js did not load.");
      } else {
        if (PADDLE_CLIENT_TOKEN.startsWith("test_")) {
          window.Paddle.Environment.set("sandbox");
        }

        window.Paddle.Initialize({
          token: PADDLE_CLIENT_TOKEN,
          checkout: {
            settings: {
              displayMode: "overlay",
              theme: "dark",
              locale: "en",
            },
          },
        });

        setStatus("Opening Paddle checkout...");
        window.Paddle.Checkout.open({
          transactionId,
        });
      }
    </script>
  </body>
</html>
